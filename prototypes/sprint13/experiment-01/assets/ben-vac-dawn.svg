 <linearGradient id="water" x2=".3" y2="1"><stop stop-color="#8ea99a"/><stop offset=".55" stop-color="#567f79"/><stop offset="1" stop-color="#244d50"/></linearGradient>
 <linearGradient id="light" x2="0" y2="1"><stop stop-color="#f5db98" stop-opacity=".7"/><stop offset="1" stop-color="#e8d397" stop-opacity="0"/></linearGradient>
 <linearGradient id="roof" x2=".2" y2="1"><stop stop-color="#b39760"/><stop offset="1" stop-color="#74573b"/></linearGradient>
 <pattern id="ripples" width="190" height="61" patternUnits="userSpaceOnUse"><path d="M10 19q35-8 72 0m26 23q31-6 68 0" fill="none" stroke="#d2dbbd" stroke-width="2" opacity=".2"/></pattern>
