<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">Bến Vạc — một buổi sớm trên sông</title>
<desc id="desc">Minh họa ý tưởng hư cấu: nhà sàn lợp lá trên những doi đất, thuyền nhỏ qua mặt nước xanh, bến gỗ và một thuyền đang sửa. Ánh sáng vàng dịu, lau sậy ở tiền cảnh. Không phải bản đồ di chuyển hoặc tái dựng khảo cổ.</desc>
<defs>
