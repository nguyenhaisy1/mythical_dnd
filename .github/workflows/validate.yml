name: Validate core and documentation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Documentation and reference checks
        run: |
          python3 tools/docs/build_docs.py --check
          python3 tools/checks/validate_reference.py
          python3 tools/checks/check_contract_vectors.py
          python3 tools/checks/check_architecture.py
          python3 tools/checks/check_handoff.py
      - name: Headless Sprint 1 primitive gate
        run: python3 tools/tests/run_runtime.py
      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-evidence
          path: tests/results/
          if-no-files-found: error
      - name: Host status smoke check
        run: dotnet run --project engine/HeadlessRunner/Game.Headless.csproj --configuration Release --no-build -- --status
